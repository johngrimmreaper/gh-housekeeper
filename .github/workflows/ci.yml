name: Rust CI

on:
  push:
    branches: [main, work/run-business-days-latest-by]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  rust:
    name: fmt / check / test / clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Read-only live workflow-run policy smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_STATE_HOME: /tmp/gh-housekeeper-policy-smoke-state
        run: |
          cat > /tmp/gh-housekeeper-policy-smoke.toml <<'POLICY'
          [defaults.runs]
          keep_business_days = 10000

          [[rules]]
          id = "branch-smoke"
          resource = "workflow_run"
          repository = "johngrimmreaper/gh-housekeeper"
          workflow = "Rust CI"
          branch = "work/run-business-days-latest-by"
          keep_business_days = 0
          keep_latest = 2
          keep_latest_by = "workflow"
          POLICY
          cargo run --quiet -p gh-housekeeper-cli -- runs protections init
          cargo run --quiet -p gh-housekeeper-cli -- classify runs --repo johngrimmreaper/gh-housekeeper --policy /tmp/gh-housekeeper-policy-smoke.toml --format json > /tmp/gh-housekeeper-classification.json
          python3 -c 'import json; d=json.load(open("/tmp/gh-housekeeper-classification.json")); print("real read-only classification:", d["run_count"], "runs")'
          cargo run --quiet -p gh-housekeeper-cli -- purge plan runs --repo johngrimmreaper/gh-housekeeper --policy /tmp/gh-housekeeper-policy-smoke.toml --output /tmp/gh-housekeeper-run-policy-plan.json
          cargo run --quiet -p gh-housekeeper-cli -- purge revalidate /tmp/gh-housekeeper-run-policy-plan.json
