[workspace]
resolver = "3"
members = [
    "crates/gh-housekeeper-core",
    "crates/gh-housekeeper-github",
    "crates/gh-housekeeper-policy",
    "crates/gh-housekeeper-storage",
    "crates/gh-housekeeper-cli",
    "crates/gh-housekeeper-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/johngrimmreaper/gh-housekeeper"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
